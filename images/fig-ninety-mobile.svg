<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" role="img">
<title>整機來源比例示意</title>
<desc>約 90% 來自美國及其盟友（Luckey 自述），其餘約 10%；目標是 100% 美國本土製造，沒有日期。</desc>
<style>
svg{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.bg{fill:#121A30}.ink{fill:#EAF0FF}.mut{fill:#9AA8C7}.line{stroke:#2C3A63}
.acc{fill:#3B63E0}.amb{fill:#FFB84D}.ambs{stroke:#FFB84D}
.sq{fill:#2A3558}.on{fill:#FFFFFF}.red{fill:#FF8A8A}.reds{stroke:#FF8A8A}
.hatch{stroke:#FFB84D;stroke-width:3}
@media (prefers-color-scheme:light){
.bg{fill:#FFFFFF}.ink{fill:#0E1530}.mut{fill:#51608A}.line{stroke:#D7DCEB}
.acc{fill:#2347D6}.amb{fill:#9A5700}.ambs{stroke:#9A5700}
.sq{fill:#CBD3EA}.on{fill:#FFFFFF}.red{fill:#B02A2A}.reds{stroke:#B02A2A}
.hatch{stroke:#9A5700}}
</style>
<rect class="bg" width="600" height="560" rx="22"/>
<defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="12"/></pattern></defs><text x="30" y="62" class="mut" font-size="26" font-weight="400" text-anchor="start">整機來源（Luckey 自述）</text><rect class="acc" x="30" y="88" width="468" height="84" rx="18"/><rect class="amb" x="498" y="88" width="72" height="84" rx="18" opacity=".28"/><rect x="498" y="88" width="72" height="84" rx="18" fill="url(#h)"/><rect x="498" y="88" width="72" height="84" rx="18" fill="none" class="ambs" stroke-width="3"/><text x="54" y="146" class="on" font-size="46" font-weight="800" text-anchor="start">約 90%</text><text x="236" y="144" class="on" font-size="26" font-weight="700" text-anchor="start">美國及其盟友</text><text x="520" y="214" class="amb" font-size="24" font-weight="700" text-anchor="middle">其餘約 10%</text><line class="line" x1="30" y1="244" x2="570" y2="244" stroke-width="2"/><text x="30" y="222" class="mut" font-size="24" font-weight="400" text-anchor="start">美國與盟友各占多少，影片沒有說</text><text x="30" y="300" class="ink" font-size="30" font-weight="800" text-anchor="start">目標：100% 美國本土製造</text><text x="30" y="340" class="mut" font-size="26" font-weight="400" text-anchor="start">技術藍圖，沒有日期</text><text x="30" y="404" class="mut" font-size="26" font-weight="400" text-anchor="start">他提到的零件</text><text x="30" y="446" class="ink" font-size="28" font-weight="400" text-anchor="start">面板：另一個國家製造</text><text x="30" y="496" class="ink" font-size="28" font-weight="400" text-anchor="start">蓋板玻璃：美國公司</text>
</svg>
