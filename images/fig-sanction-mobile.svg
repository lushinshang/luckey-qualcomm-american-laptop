<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 880" role="img">
<title>2025-12-26 中國反制名單示意</title>
<desc>20 家美國國防企業的轉載名單沒有列出 Anduril 公司；10 名高階主管的名單第一位是 Palmer Luckey。</desc>
<style>
svg{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.bg{fill:#121A30}.ink{fill:#EAF0FF}.mut{fill:#9AA8C7}.line{stroke:#2C3A63}
.acc{fill:#3B63E0}.amb{fill:#FFB84D}.ambs{stroke:#FFB84D}
.sq{fill:#2A3558}.on{fill:#FFFFFF}.red{fill:#FF8A8A}.reds{stroke:#FF8A8A}
.hatch{stroke:#FFB84D;stroke-width:3}
@media (prefers-color-scheme:light){
.bg{fill:#FFFFFF}.ink{fill:#0E1530}.mut{fill:#51608A}.line{stroke:#D7DCEB}
.acc{fill:#2347D6}.amb{fill:#9A5700}.ambs{stroke:#9A5700}
.sq{fill:#CBD3EA}.on{fill:#FFFFFF}.red{fill:#B02A2A}.reds{stroke:#B02A2A}
.hatch{stroke:#9A5700}}
</style>
<rect class="bg" width="600" height="880" rx="22"/>
<text x="30" y="60" class="ink" font-size="30" font-weight="800" text-anchor="start">2025-12-26 中國反制名單</text><text x="30" y="110" class="mut" font-size="24" font-weight="400" text-anchor="start">20 家美國國防企業</text><rect class="sq" x="30" y="128" width="56" height="56" rx="8"/><rect class="sq" x="100" y="128" width="56" height="56" rx="8"/><rect class="sq" x="170" y="128" width="56" height="56" rx="8"/><rect class="sq" x="240" y="128" width="56" height="56" rx="8"/><rect class="sq" x="310" y="128" width="56" height="56" rx="8"/><rect class="sq" x="30" y="198" width="56" height="56" rx="8"/><rect class="sq" x="100" y="198" width="56" height="56" rx="8"/><rect class="sq" x="170" y="198" width="56" height="56" rx="8"/><rect class="sq" x="240" y="198" width="56" height="56" rx="8"/><rect class="sq" x="310" y="198" width="56" height="56" rx="8"/><rect class="sq" x="30" y="268" width="56" height="56" rx="8"/><rect class="sq" x="100" y="268" width="56" height="56" rx="8"/><rect class="sq" x="170" y="268" width="56" height="56" rx="8"/><rect class="sq" x="240" y="268" width="56" height="56" rx="8"/><rect class="sq" x="310" y="268" width="56" height="56" rx="8"/><rect class="sq" x="30" y="338" width="56" height="56" rx="8"/><rect class="sq" x="100" y="338" width="56" height="56" rx="8"/><rect class="sq" x="170" y="338" width="56" height="56" rx="8"/><rect class="sq" x="240" y="338" width="56" height="56" rx="8"/><rect class="sq" x="310" y="338" width="56" height="56" rx="8"/><rect x="30" y="430" width="56" height="56" rx="8" fill="none" class="reds" stroke-width="3" stroke-dasharray="7 6"/><text x="104" y="454" class="red" font-size="24" font-weight="700" text-anchor="start"><tspan x="104">Anduril 公司：</tspan><tspan x="104" dy="30">轉載內容沒有列出</tspan></text><text x="30" y="558" class="mut" font-size="24" font-weight="400" text-anchor="start">10 名高階主管</text><rect class="acc" x="30" y="576" width="56" height="56" rx="8"/><rect class="sq" x="100" y="576" width="56" height="56" rx="8"/><rect class="sq" x="170" y="576" width="56" height="56" rx="8"/><rect class="sq" x="240" y="576" width="56" height="56" rx="8"/><rect class="sq" x="310" y="576" width="56" height="56" rx="8"/><rect class="sq" x="30" y="646" width="56" height="56" rx="8"/><rect class="sq" x="100" y="646" width="56" height="56" rx="8"/><rect class="sq" x="170" y="646" width="56" height="56" rx="8"/><rect class="sq" x="240" y="646" width="56" height="56" rx="8"/><rect class="sq" x="310" y="646" width="56" height="56" rx="8"/><text x="30" y="724" class="ink" font-size="32" font-weight="800" text-anchor="start">Palmer Luckey</text><text x="30" y="762" class="mut" font-size="25" font-weight="400" text-anchor="start">Anduril 創辦人，名單第一位</text><line class="line" x1="30" y1="790" x2="570" y2="790" stroke-width="2"/><text x="30" y="826" class="mut" font-size="24" font-weight="400" text-anchor="start"><tspan x="30">措施：凍結中國境內財產、禁止交易；</tspan><tspan x="30" dy="32">高階主管另不予簽發簽證、不准入境</tspan></text>
