<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img">
<title>整機來源比例示意</title>
<desc>約 90% 來自美國及其盟友（Luckey 自述），其餘約 10%；目標是 100% 美國本土製造，沒有日期。</desc>
<style>
svg{font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.bg{fill:#121A30}.ink{fill:#EAF0FF}.mut{fill:#9AA8C7}.line{stroke:#2C3A63}
.acc{fill:#3B63E0}.amb{fill:#FFB84D}.ambs{stroke:#FFB84D}
.sq{fill:#2A3558}.on{fill:#FFFFFF}.red{fill:#FF8A8A}.reds{stroke:#FF8A8A}
.hatch{stroke:#FFB84D;stroke-width:3}
@media (prefers-color-scheme:light){
.bg{fill:#FFFFFF}.ink{fill:#0E1530}.mut{fill:#51608A}.line{stroke:#D7DCEB}
.acc{fill:#2347D6}.amb{fill:#9A5700}.ambs{stroke:#9A5700}
.sq{fill:#CBD3EA}.on{fill:#FFFFFF}.red{fill:#B02A2A}.reds{stroke:#B02A2A}
.hatch{stroke:#9A5700}}
</style>
<rect class="bg" width="1200" height="470" rx="22"/>
<defs><pattern id="h" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch" x1="0" y1="0" x2="0" y2="12"/></pattern></defs><text x="60" y="62" class="mut" font-size="28" font-weight="400" text-anchor="start">整機來源（Luckey 自述）</text><rect class="acc" x="60" y="88" width="972" height="100" rx="20"/><rect class="amb" x="1032" y="88" width="108" height="100" rx="20" opacity=".28"/><rect x="1032" y="88" width="108" height="100" rx="20" fill="url(#h)"/><rect x="1032" y="88" width="108" height="100" rx="20" fill="none" class="ambs" stroke-width="3"/><text x="96" y="156" class="on" font-size="56" font-weight="800" text-anchor="start">約 90%</text><text x="300" y="154" class="on" font-size="36" font-weight="700" text-anchor="start">美國及其盟友</text><text x="1086" y="232" class="amb" font-size="28" font-weight="700" text-anchor="middle">其餘約 10%</text><line class="line" x1="60" y1="262" x2="1140" y2="262" stroke-width="2"/><text x="60" y="236" class="mut" font-size="24" font-weight="400" text-anchor="start">美國與盟友各占多少，影片沒有說</text><text x="60" y="326" class="ink" font-size="38" font-weight="800" text-anchor="start">目標：100% 美國本土製造</text><text x="60" y="372" class="mut" font-size="28" font-weight="400" text-anchor="start">技術藍圖，沒有日期</text><text x="660" y="310" class="mut" font-size="26" font-weight="400" text-anchor="start">他提到的零件</text><text x="660" y="352" class="ink" font-size="26" font-weight="400" text-anchor="start">面板：另一個國家製造</text><text x="660" y="392" class="ink" font-size="26" font-weight="400" text-anchor="start">蓋板玻璃：美國公司</text>
</svg>
